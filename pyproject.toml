[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ningx-optimizer"
version = "0.1.0"
description = "AI-assisted Windows performance and maintenance application with a deterministic safety spine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "NingX" }]

dependencies = [
    "PySide6>=6.8",
    "psutil>=6.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
charts = ["pyqtgraph>=0.13"]

[project.scripts]
ningx = "ningx.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ningx"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "windows_only: requires a real Windows session",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF",
    "S", "A", "T20", "PTH", "RET", "ARG", "PL",
]
ignore = [
    "PLR0911",  # policy engine returns many early reasons on purpose
    "PLR0912",  # branching is the point of a policy table
    "PLR0913",
    "PLR0915",
    "PLR2004",  # magic values in tests
    "S101",     # assert is fine in tests and in internal invariants
    "T201",     # the CLI must print
    "RUF001",   # en-dashes used in documentation strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "ARG005", "S108"]
# Lazy imports keep optional Windows, Qt and provider dependencies out of the
# core import graph; the mutation stubs in winapi/ops.py take unused arguments
# by design because they must match the WindowsOps protocol.
"src/ningx/cli.py" = ["PLC0415"]
"src/ningx/__main__.py" = ["PLC0415"]
"src/ningx/app/bootstrap.py" = ["PLC0415"]
"src/ningx/security/process_validator.py" = ["PLC0415"]
"src/ningx/security/secret_store.py" = ["PLC0415"]
"src/ningx/security/startup_collector.py" = ["PLC0415"]
"src/ningx/telemetry/gpu.py" = ["PLC0415"]
"src/ningx/telemetry/sampler.py" = ["PLC0415"]
"src/ningx/providers/gemini.py" = ["PLC0415"]
# The stand-in provider must keep the protocol's parameter names even where it
# has no use for them; it answers every call with "not configured".
"src/ningx/providers/base.py" = ["ARG002"]
"src/ningx/ui/app.py" = ["PLC0415"]
"src/ningx/ui/theme.py" = ["PLC0415"]
"src/ningx/winapi/ops.py" = ["PLC0415", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["ningx"]

[tool.mypy]
python_version = "3.12"
files = ["src/ningx"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["win32cred", "win32pdh", "win32api", "win32con", "win32security", "win32process", "pywintypes"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["PySide6.*", "pyqtgraph.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/ningx"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
